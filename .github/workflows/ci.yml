name: Renderer CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "renderer/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run validation and render smoke tests
        run: python -m unittest discover -s tests -v
