name: Render Private Comic Bundle

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique render job ID (8-64 letters, digits, underscore or hyphen)"
        required: true
        type: string
      drive_file_id:
        description: "Google Drive file ID of the private ZIP inside the configured input folder"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: comic-render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_INPUT_FOLDER_ID: ${{ secrets.DRIVE_INPUT_FOLDER_ID }}
      DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
      COMIC_JOB_ID: ${{ inputs.job_id }}
      DRIVE_FILE_ID: ${{ inputs.drive_file_id }}

    steps:
      - name: Check out renderer source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Google Drive client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check google-auth requests

      - name: Download from private Drive, validate, render and upload to private Drive
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          job_id = os.environ["COMIC_JOB_ID"]
          file_id = os.environ["DRIVE_FILE_ID"]
          input_folder_id = os.environ["DRIVE_INPUT_FOLDER_ID"]
          output_folder_id = os.environ["DRIVE_OUTPUT_FOLDER_ID"]
          if not re.fullmatch(r"[A-Za-z0-9_-]{8,64}", job_id):
              raise SystemExit("Invalid job_id.")
          if not re.fullmatch(r"[A-Za-z0-9_-]{10,200}", file_id):
              raise SystemExit("Invalid Google Drive file ID.")
          required = ("GOOGLE_SERVICE_ACCOUNT_JSON", "DRIVE_INPUT_FOLDER_ID", "DRIVE_OUTPUT_FOLDER_ID")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing GitHub Actions repository secrets: " + ", ".join(missing))

          try:
              service_account_info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
              credentials = service_account.Credentials.from_service_account_info(
                  service_account_info,
                  scopes=["https://www.googleapis.com/auth/drive"],
              )
          except Exception as exc:
              raise SystemExit("Google service-account secret is not valid JSON credentials.") from exc

          session = AuthorizedSession(credentials)
          api = "https://www.googleapis.com/drive/v3"
          metadata_response = session.get(
              f"{api}/files/{file_id}",
              params={"fields": "id,name,mimeType,parents,size,trashed"},
              timeout=60,
          )
          metadata_response.raise_for_status()
          source_meta = metadata_response.json()
          if source_meta.get("trashed"):
              raise SystemExit("Input ZIP is in trash.")
          if input_folder_id not in source_meta.get("parents", []):
              raise SystemExit("Input file is not directly inside the configured private input folder.")
          if source_meta.get("mimeType") != "application/zip":
              raise SystemExit("Input file must be an application/zip file.")
          if int(source_meta.get("size", 0)) > 2_000_000_000:
              raise SystemExit("Compressed input ZIP exceeds the 2 GB safety limit.")

          with tempfile.TemporaryDirectory(prefix="comic-job-") as temp:
              root = Path(temp)
              bundle = root / "bundle.zip"
              extracted = root / "bundle"
              extracted.mkdir()

              with session.get(
                  f"{api}/files/{file_id}",
                  params={"alt": "media"},
                  stream=True,
                  timeout=(30, 180),
              ) as response:
                  response.raise_for_status()
                  with bundle.open("wb") as output_file:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              output_file.write(chunk)

              with zipfile.ZipFile(bundle) as archive:
                  entries = archive.infolist()
                  if not entries or len(entries) > 2000:
                      raise SystemExit("Bundle must contain between 1 and 2000 entries.")
                  if sum(item.file_size for item in entries) > 2_000_000_000:
                      raise SystemExit("Uncompressed bundle exceeds the 2 GB safety limit.")
                  names = set()
                  for item in entries:
                      name = item.filename
                      path = PurePosixPath(name)
                      if not name or path.is_absolute() or ".." in path.parts or chr(92) in name:
                          raise SystemExit("Unsafe path found in ZIP bundle.")
                      if (item.external_attr >> 16) & 0o170000 == 0o120000:
                          raise SystemExit("Symbolic links are not allowed in ZIP bundles.")
                      if name in names:
                          raise SystemExit("Duplicate ZIP entry path.")
                      names.add(name)
                  if "manifest.json" not in names:
                      raise SystemExit("Bundle must contain manifest.json at its root.")
                  archive.extractall(extracted)

              manifest = extracted / "manifest.json"
              output = root / "comic.mp4"
              subprocess.run(
                  ["python", "-m", "renderer.validate_manifest", str(manifest)],
                  check=True,
              )
              subprocess.run(
                  ["python", "-m", "renderer.render", str(manifest), "--output", str(output)],
                  check=True,
              )

              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error", "-show_entries",
                      "stream=codec_type,codec_name,width,height", "-of", "json", str(output)
                  ],
                  check=True, capture_output=True, text=True,
              )
              streams = json.loads(probe.stdout).get("streams", [])
              video = next((stream for stream in streams if stream.get("codec_type") == "video"), None)
              if not video or video.get("codec_name") != "h264" or video.get("width") != 1280 or video.get("height") != 720:
                  raise SystemExit("Rendered MP4 failed the H.264 1280x720 output check.")
              audio = [stream for stream in streams if stream.get("codec_type") == "audio"]
              if audio and any(stream.get("codec_name") != "aac" for stream in audio):
                  raise SystemExit("Rendered MP4 contains a non-AAC audio stream.")

              total_size = output.stat().st_size
              upload_metadata = {
                  "name": f"{job_id}.mp4",
                  "mimeType": "video/mp4",
                  "parents": [output_folder_id],
                  "description": "Rendered by Global Comic Render Engine; original source bundle retained privately.",
              }
              init = session.post(
                  "https://www.googleapis.com/upload/drive/v3/files",
                  params={"uploadType": "resumable", "fields": "id,name,mimeType,parents,size"},
                  json=upload_metadata,
                  headers={
                      "X-Upload-Content-Type": "video/mp4",
                      "X-Upload-Content-Length": str(total_size),
                  },
                  timeout=60,
              )
              init.raise_for_status()
              upload_url = init.headers.get("Location")
              if not upload_url:
                  raise SystemExit("Google Drive did not return a resumable upload URL.")

              uploaded = None
              chunk_size = 8 * 1024 * 1024
              with output.open("rb") as rendered_file:
                  start = 0
                  while start < total_size:
                      chunk = rendered_file.read(chunk_size)
                      if not chunk:
                          break
                      end = start + len(chunk) - 1
                      result = session.put(
                          upload_url,
                          data=chunk,
                          headers={
                              "Content-Length": str(len(chunk)),
                              "Content-Type": "video/mp4",
                              "Content-Range": f"bytes {start}-{end}/{total_size}",
                          },
                          timeout=(30, 300),
                      )
                      if end + 1 < total_size:
                          if result.status_code != 308:
                              result.raise_for_status()
                              raise SystemExit("Unexpected response during resumable Drive upload.")
                      else:
                          result.raise_for_status()
                          uploaded = result.json()
                      start = end + 1

              if not uploaded or not uploaded.get("id"):
                  raise SystemExit("Google Drive did not confirm the rendered MP4 upload.")

              verify_response = session.get(
                  f"{api}/files/{uploaded['id']}",
                  params={"fields": "id,name,mimeType,parents,size"},
                  timeout=60,
              )
              verify_response.raise_for_status()
              saved = verify_response.json()
              if output_folder_id not in saved.get("parents", []) or int(saved.get("size", 0)) != total_size:
                  raise SystemExit("Uploaded MP4 verification failed; source ZIP was retained.")
              print(
                  "Private render verified. Drive file ID: "
                  + saved["id"]
                  + " | name: "
                  + saved["name"]
                  + " | bytes: "
                  + str(total_size)
              )
              print("Source ZIP was retained; no input file was deleted.")
          PY
