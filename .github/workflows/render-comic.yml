name: Render 40-Panel Persian Audio Comic
on:
  workflow_dispatch:
    inputs:
      job_id: {description: "Unique render job ID", required: true, type: string}
      drive_file_name: {description: "Private Drive ZIP filename", required: true, type: string}
permissions: {contents: read}
concurrency: {group: "audio-comic-${{ inputs.job_id }}", cancel-in-progress: false}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMIC_JOB_ID: ${{ inputs.job_id }}
      DRIVE_FILE_NAME: ${{ inputs.drive_file_name }}
      N8N_COMIC_BRIDGE_KEY: ${{ secrets.N8N_COMIC_BRIDGE_KEY }}
      N8N_COMIC_BRIDGE_BASE: https://ata007.app.n8n.cloud/webhook/comic-render-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install FFmpeg and Persian TTS
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --disable-pip-version-check requests edge-tts
      - name: Download private comic ZIP
        run: |
          python - <<'PY'
          import os,re,tempfile,zipfile
          from pathlib import Path,PurePosixPath
          import requests
          job=os.environ["COMIC_JOB_ID"]; name=os.environ["DRIVE_FILE_NAME"]; key=os.environ.get("N8N_COMIC_BRIDGE_KEY"); base=os.environ["N8N_COMIC_BRIDGE_BASE"].rstrip("/")
          if not re.fullmatch(r"[A-Za-z0-9_-]{8,64}",job): raise SystemExit("Invalid job id")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,119}\\.zip",name,re.I): raise SystemExit("Invalid ZIP filename")
          if not key: raise SystemExit("Missing N8N_COMIC_BRIDGE_KEY")
          with requests.post(base+"/download",json={"fileName":name},headers={"Authorization":key},stream=True,timeout=(20,95)) as r:
              r.raise_for_status()
              if r.headers.get("Content-Type","").split(";")[0].lower()!="application/zip": raise SystemExit("Bridge did not return ZIP")
              with tempfile.NamedTemporaryFile(delete=False,suffix=".zip") as f:
                  total=0
                  for chunk in r.iter_content(1024*1024):
                      if chunk:
                          total+=len(chunk)
                          if total>100_000_000: raise SystemExit("ZIP exceeds 100 MB")
                          f.write(chunk)
                  zp=Path(f.name)
          out=Path("comic_input"); out.mkdir(exist_ok=True)
          with zipfile.ZipFile(zp) as z:
              es=z.infolist()
              if not es or len(es)>2000 or sum(x.file_size for x in es)>500_000_000: raise SystemExit("ZIP safety limits exceeded")
              seen=set()
              for x in es:
                  p=PurePosixPath(x.filename)
                  if not x.filename or p.is_absolute() or ".." in p.parts or chr(92) in x.filename or x.filename in seen: raise SystemExit("Unsafe/duplicate ZIP entry")
                  if (x.external_attr>>16)&0o170000==0o120000: raise SystemExit("Symlink not allowed")
                  seen.add(x.filename)
              if "manifest.json" not in seen: raise SystemExit("manifest missing")
              z.extractall(out)
          print(f"Downloaded {len(es)} files ({total} bytes)")
          PY
      - name: Generate one Persian narration track per slide
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          root=Path("comic_input"); mp=root/"manifest.json"; m=json.loads(mp.read_text(encoding="utf-8")); panels=m.get("panels")
          if not isinstance(panels,list) or len(panels)!=40: raise SystemExit("Expected exactly 40 panels")
          voice=(m.get("audio") or {}).get("voice","fa-IR-FaridNeural"); folder=root/"audio"; folder.mkdir(exist_ok=True)
          for i,p in enumerate(panels,1):
              seq=f"{i:02d}"; narration=p.get("narration")
              if str(p.get("seq"))!=seq or not isinstance(narration,str) or not narration.strip(): raise SystemExit(f"Panel {seq}: sequence/narration invalid")
              words=len(narration.split())
              if words>14: raise SystemExit(f"Panel {seq}: narration has {words} words; maximum 14.")
              path=folder/f"panel_{seq}.mp3"
              subprocess.run([sys.executable,"-m","edge_tts","--voice",voice,"--text",narration.strip(),"--write-media",str(path)],check=True)
              if not path.is_file() or path.stat().st_size<500: raise SystemExit(f"Panel {seq}: TTS file invalid")
              p["narrationAudio"]=f"audio/panel_{seq}.mp3"
          total_words=sum(len(p["narration"].split()) for p in panels)
          if total_words>480: raise SystemExit(f"Total narration {total_words} words; maximum 480.")
          m["audio"]={"narrationMode":"per_panel_tts","language":"fa-IR","voice":voice,"maxDurationSeconds":240}
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"40 Persian narration files generated ({total_words} words; hard audio limit 240 seconds)")
          PY
      - name: Validate and render synchronized audio slideshow
        run: |
          python - <<'PY'
          import json,os,subprocess,requests
          from pathlib import Path
          m=Path("comic_input/manifest.json"); out=Path("comic.mp4"); base=os.environ["N8N_COMIC_BRIDGE_BASE"].rstrip("/"); headers={"Authorization":os.environ["N8N_COMIC_BRIDGE_KEY"]}
          subprocess.run(["python","-m","renderer.validate_manifest",str(m)],check=True)
          subprocess.run(["python","-m","renderer.render",str(m),"--output",str(out)],check=True)
          q=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type,codec_name,width,height:format=duration","-of","json",str(out)],check=True,capture_output=True,text=True)
          data=json.loads(q.stdout); streams=data["streams"]; v=next((x for x in streams if x.get("codec_type")=="video"),None); a=next((x for x in streams if x.get("codec_type")=="audio"),None)
          if not v or v.get("codec_name")!="h264" or v.get("width")!=1280 or v.get("height")!=720 or not a or a.get("codec_name")!="aac": raise SystemExit("MP4 stream validation failed")
          duration=float(data["format"]["duration"])
          if duration>240: raise SystemExit(f"MP4 duration {duration:.2f}s exceeds 4 minutes.")
          size=out.stat().st_size
          if not 0<size<=100_000_000: raise SystemExit("MP4 exceeds bridge size limit")
          with out.open("rb") as f: r=requests.post(base+"/upload",params={"fileName":os.environ["COMIC_JOB_ID"]+".mp4"},headers=headers,files={"data":(out.name,f,"video/mp4")},timeout=(20,95))
          r.raise_for_status(); saved=r.json()
          if saved.get("ok") is not True or not saved.get("fileId") or saved.get("mimeType")!="video/mp4": raise SystemExit("Private Drive upload not confirmed")
          print(f"Audio comic uploaded: {saved['name']} | {duration:.2f}s | Drive ID {saved['fileId']} | {size} bytes; input ZIP retained")
          PY